name: 功能请求
description: 希望面板或 Agent 流程支持的能力
title: "[feat] "
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        先确认不在「不做清单」里：多币种、月结批次、对账撤销、账户关闭/合并/改名、内置账单解析、多用户/家庭共享、移动端、云同步、遥测、付费订阅。
        这些方向当前不接。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它，现在怎么绕过的
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望结果
      placeholder: 描述你希望看到的行为，不必设计实现
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我确认它不属于上面的「不做清单」
          required: true
        - label: 它不要求 Agent 直接写账本（写入门禁只能由人批准）
          required: true
