name: 缺陷报告
description: 面板、引擎安装或账本行为不符合预期
title: "[bug] "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 [README](https://github.com/dhr2333/dsh-ledger#readme) 与 [DETAIL](https://github.com/dhr2333/dsh-ledger/blob/main/docs/DETAIL.md)。
        **不要上传包含真实姓名、卡号或账号的账单原文**；必要时只贴字段结构。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - linux-x64
        - linux-arm64
        - darwin-x64
        - darwin-arm64
        - win32-x64
        - win32-arm64
        - 其他
    validations:
      required: true
  - type: input
    id: dsh_version
    attributes:
      label: DSH 版本
      placeholder: 例如 0.2.2-rc.3
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      placeholder: 例如 0.3.2
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: 引擎状态
      description: 面板「引擎」里显示的状态；看过 engine.json 的 pythonSource / coreSource 更好
      options:
        - bundled（内置运行时）
        - 系统 Python 兜底
        - 未安装 / 安装失败
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开面板
        2. 点击……
        3. 期望……，实际……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 面板报错、引擎安装日志；请先抹除隐私信息
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除账单与日志中的个人隐私信息
          required: true
