# dsh-ledger-domain — 账本的 DSH 展示页
#
# 本插件不含账本规则：HTTP 路由只做浏览器会话校验、请求形状校验，
# 然后执行 `python -m ledger_domain` 并回传 JSON。它不注册任何 Agent 工具。
#
# 这里只放可移植的默认值，不要写死某台机器的路径：本文件会随插件一起
# 安装到每个 profile。个人路径写在 profile 的 cordis.patch.yml 覆盖项里，
# 那里的 id 与本行相同，优先级更高。
#
# root        —— 账本根目录（含 main.bean）；默认 $DSH_HOME/ledger
# corePath    —— Python 核心库项目根；留空时自动发现插件同级或
#                $DSH_HOME/ledger-domain-src 下的 ledger-domain-core
# engineDir   —— 托管引擎目录；默认 $DSH_HOME/ledger-engine
# systemPython—— 创建托管 venv 的解释器；默认 python3
# pythonPath  —— 外部引擎解释器；留空则使用托管引擎一键安装
# beanCheck / beanQuery —— 含 / 时相对 root；缺失时核心自动回退到引擎 venv
- insert:
    - id: ledger-domain
      name: '@local/dsh-ledger-domain'
